[project]
name = "qingci-bot-ce"
version = "1.4.0"
description = "QQ Bot 框架，对接 LLBot (OneBot 11)，支持 LLM 对话、Web UI 和 Desktop UI"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "aiocqhttp>=1.4.4",
    "aiosqlite>=0.20.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "litellm>=1.50.0",
    "apscheduler>=3.10,<4",
    "pywebview>=5.0",
    "pystray>=0.19.0",
    "pillow>=11.0",
    "mcp>=1.6,<2",
    "lancedb>=0.15,<1",
]

[project.scripts]
qingci-bot-ce = "main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "qingci-bot-ce[test,build]",
    "ruff>=0.8",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=bot", "--cov=api", "--cov-report=term-missing"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "dist", "build", "tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "bot*", "desktop*", "plugins*"]
exclude = ["web*", "data*", "migrations*", "dist*", "tests*", "scripts*"]