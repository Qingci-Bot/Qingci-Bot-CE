[project]
name = "qingci-bot-ce"
version = "1.18.7"
description = "多平台机器人框架（OneBot 11 / OneBot 12 / Telegram），支持 LLM 对话、Web UI 和 Desktop UI"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    # 独立插件 SDK：协议层（PluginBase/Matcher/Permission/Rule/MessageContext）唯一来源，
    # bot/plugin/ 下为薄转发。由私有索引分发（见文末 [[tool.uv.index]] 与 [tool.uv.sources]），
    # 版本精确锁定保证可复现；SDK 发新版后更新此处版本号并重新 uv lock。
    "qingci-plugin-sdk==1.15.0",
    # 依赖上界策略：核心依赖一律给「下一个主版本」上界。CI/开发由 uv.lock 精确锁定，
    # 上界主要保护「用户按 pyproject 直接 pip install」的场景——litellm / fastapi 等
    # 属于高频 breaking 的包，被动跨主版本升级会直接破坏运行时。
    # 升级主版本时手动放宽上界并重新 uv lock（Dependabot 会提 PR 提示）。
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "websockets>=14.0,<17",
    "aiocqhttp>=1.4.4,<2",
    "aiohttp>=3.9.0,<4",
    "aiosqlite>=0.20.0,<1",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "packaging>=24.0",
    "pyyaml>=6.0,<7",
    "httpx>=0.28.0,<1",
    "litellm>=1.50.0,<2",
    "apscheduler>=3.10,<4",
    "mcp>=1.6,<2",
]

[project.scripts]
qingci-bot-ce = "main:main"

[project.optional-dependencies]
# 向量知识库（语义检索）依赖。lancedb/pyarrow 体积大且仅增强功能，
# 缺省时 KeywordKnowledgeStore 关键词检索仍可用，故作为可选特性。
vector = [
    "lancedb>=0.15,<1",
]
# HTML → 图片渲染服务依赖（bot/core/html_renderer.py）。playwright 体积大
# 且需单独下载浏览器（playwright install chromium），故为可选特性；缺失时
# 渲染能力自动降级不可用（调用方回退），不影响框架启动。
render = [
    "playwright>=1.62.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",
]
build = [
    "pyinstaller>=6.0",
    # 打包需收集 playwright Python 包（spec collect_all）并内置无头浏览器
    # （build.bat 的 playwright install），故与 render 组并列声明
    "playwright>=1.62.0",
]
dev = [
    "qingci-bot-ce[test,build,vector,render]",
    "ruff==0.16.3",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under 为覆盖率防回退门槛：低于该值测试直接失败
# 50% 全局（当前 51.9%，LLM 子系统补强后达标）；bot/llm 目录另有 70% 门槛（见 CI）
addopts = ["--cov=bot", "--cov=api", "--cov-report=term-missing", "--cov-fail-under=50"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── 依赖索引 ────────────────────────────────────────────────
# qingci-plugin-sdk 由私有索引分发（Twine 兼容，上传走 /legacy/）。
# 索引对私有项目只返回本地文件；未收录的包会中转代理上游 PyPI（链接改写为
# /proxy/），上游异常时按 404 处理。本项目的其余依赖仍从默认源（PyPI）解析。
# explicit = true：此索引只服务下面 sources 显式绑定的包，不参与其他包的
# 解析——避免为 130 个依赖逐个请求私有索引，也避免同名包被公网抢占。
[[tool.uv.index]]
name = "qingci"
url = "https://pypi.luoqingciya.cn/simple"
publish-url = "https://admin.pypi.luoqingciya.cn/legacy/"
explicit = true

[tool.uv.sources]
qingci-plugin-sdk = { index = "qingci" }

[tool.mypy]
# 有意按 3.12 检查（与推荐运行版本一致，见 CHANGELOG）：
# requires-python 仍声明 >=3.10 以兼容旧解释器，但类型检查采用更严格/更新的标准
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "dist", "build", "tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "bot*", "desktop*", "plugins*"]
exclude = ["web*", "data*", "migrations*", "dist*", "tests*", "scripts*", "bot.testing*"]
