[project]
name = "qingci-bot-ce"
version = "1.19.4"
description = "多平台机器人框架（OneBot 11 / OneBot 12 / Telegram），支持 LLM 对话、Web UI 和 Desktop UI"
requires-python = ">=3.11"
# SPDX 表达式保持纯 GPLv3；依 GPLv3 第 7 条添加的附加条款见 NOTICE
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # 独立插件 SDK：协议层（PluginBase/Matcher/Permission/Rule/MessageContext）唯一来源，
    # bot/plugin/ 下为薄转发。
    #
    # 自 SDK 1.15.2 起由官方 PyPI 分发（Trusted Publishing），这里钉成精确版本：
    #   - CI / Docker / 源码安装都走默认 PyPI 索引，无需令牌或额外配置
    #   - 升级 SDK：改这里的版本号，再
    #     `uv lock --default-index https://pypi.org/simple`（CI 校验锁文件、钉定版本与已安装版本一致）
    #   - 本地改 SDK 源码时用 `uv pip install -e ..\Plugins-SDK` 覆盖
    "qingci-plugin-sdk==1.15.2",
    # 依赖上界策略：核心依赖一律给「下一个主版本」上界。CI/开发由 uv.lock 精确锁定，
    # 上界主要保护「用户按 pyproject 直接 pip install」的场景——litellm / fastapi 等
    # 属于高频 breaking 的包，被动跨主版本升级会直接破坏运行时。
    # 升级主版本时手动放宽上界并重新 uv lock（Dependabot 会提 PR 提示）。
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "websockets>=14.0,<18",
    "aiocqhttp>=1.4.4,<2",
    "aiohttp>=3.9.0,<4",
    "aiosqlite>=0.20.0,<1",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "packaging>=24.0",
    "pyyaml>=6.0,<7",
    "httpx>=0.28.0,<1",
    # litellm 上限收紧到 <1.104：1.100.4 起修掉 CVE-2026-114612，
    # 但 1.104.0 起把 filelock 钉成 `>=3.16.1,<4.0`，会把 filelock 拉回 3.x
    # ——而 1.19.0 停止支持 Python 3.10 正是为了用上 filelock 4.2.1+ 的 CVE 修复。
    # 1.103.1 是「已修 litellm CVE 且不限制 filelock」的最后一版。
    # 待 litellm 放宽该约束后可移除本上限（届时同步 `uv lock` 与 pip-audit）。
    "litellm>=1.103.1,<1.104",
    # 显式钉住 filelock 下界：1.19.0 停止支持 Python 3.10 就是为了它（4.2.1 修了 3 个
    # CVE）。写成直接依赖，防止某个间接依赖把约束放宽成 `<4` 时悄悄降级——litellm
    # 1.104+ 正是这么干的（`filelock>=3.16.1,<4.0`），解析器会静默退回 3.x。
    "filelock>=4.2.1,<5",
    "apscheduler>=3.10,<4",
    "mcp>=1.6,<2",
]

[project.scripts]
qingci-bot-ce = "main:main"

[project.optional-dependencies]
# 向量知识库（语义检索）依赖。lancedb/pyarrow 体积大且仅增强功能，
# 缺省时 KeywordKnowledgeStore 关键词检索仍可用，故作为可选特性。
vector = [
    "lancedb>=0.15,<1",
]
# HTML → 图片渲染服务依赖（bot/core/html_renderer.py）。playwright 体积大
# 且需单独下载浏览器（playwright install chromium），故为可选特性；缺失时
# 渲染能力自动降级不可用（调用方回退），不影响框架启动。
render = [
    "playwright>=1.62.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28.0",
]
build = [
    "pyinstaller>=6.0",
    # 打包需收集 playwright Python 包（spec collect_all）并内置无头浏览器
    # （build.bat 的 playwright install），故与 render 组并列声明
    "playwright>=1.62.0",
]
dev = [
    "qingci-bot-ce[test,build,vector,render]",
    "ruff==0.17.3",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under 为覆盖率防回退门槛：低于该值测试直接失败
# P0 行为锁定后全局实测 62.89%，门槛抬到 62%；bot/llm 目录另有 74% 门槛（见 CI）
# 门槛只升不降：每轮重构按新覆盖率小幅抬升，禁止下调
addopts = ["--cov=bot", "--cov=api", "--cov-report=term-missing", "--cov-fail-under=62"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── 依赖索引 ────────────────────────────────────────────────
# 只留默认源（PyPI）：所有依赖（含 qingci-plugin-sdk）都从官方 PyPI 解析，
# 不需要 `[[tool.uv.index]]` 或 `[tool.uv.sources]` 绑定。
# 若本机配置了镜像，生成锁文件时必须显式指定
# `uv lock --default-index https://pypi.org/simple`，否则 CI 的来源检查会拦截。

[tool.mypy]
# 有意按 3.12 检查（与推荐运行版本一致，见 CHANGELOG）：
# requires-python 声明 >=3.11（3.10 已停止支持：filelock 等依赖的修复版要求 3.11+），
# 类型检查按 3.12 标准
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "dist", "build", "tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "bot*", "desktop*", "plugins*"]
exclude = ["web*", "data*", "migrations*", "dist*", "tests*", "scripts*", "bot.testing*"]
