# 发布流水线：打 v* tag 触发，全自动构建并上传分发包
#
# 触发：
#   1) git tag v1.17.0 && git push origin v1.17.0   -> 构建 EXE / deb / rpm 并上传同名 Release，
#      同时构建并推送 Docker 镜像到 ghcr.io
#   2) workflow_dispatch（手动）-> 仅重建并上传 EXE / deb / rpm 到指定 Release（不推镜像）
#
# 产物命名（统一为 <包名>_<版本>_<架构> 或 <包名>-<版本>-<release>.<架构>，
# 各格式沿用其生态的分隔符约定；包名一律小写连字符，版本紧邻包名）：
#   qingci-bot-ce-<ver>-linux-x64.deb          桌面版 deb
#   qingci-bot-ce-<ver>-linux-x64.rpm          桌面版 rpm
#   qingci-bot-ce-<ver>-linux-arm64.deb        桌面版 deb（arm64）
#   qingci-bot-ce-<ver>-linux-arm64.rpm        桌面版 rpm（arm64）
#   qingci-bot-ce-<ver>-x64-setup.exe          桌面版 Windows 安装向导
#   qingci-bot-ce-<ver>-x64-portable.zip       桌面版 Windows 便携包
#   qingci-bot-ce-server-<ver>-linux-x64.deb   服务端 deb（headless + systemd）
#   qingci-bot-ce-server-<ver>-linux-x64.rpm   服务端 rpm
#   qingci-bot-ce-server-<ver>-linux-arm64.deb 服务端 deb（arm64）
#   qingci-bot-ce-server-<ver>-linux-arm64.rpm 服务端 rpm（arm64）
#
# 命名约定：<包名>-<版本>-<平台>-<架构>.<ext>，平台取 linux / macos / windows，
# 架构统一用 x64 / arm64。deb/rpm 的包内字段（Package/Architecture）仍按格式规范，
# 只有文件名统一——否则同一张发布页上会出现 amd64 / x86_64 / arm64 / aarch64
# 四种写法，用户很难判断哪个是自己的。
#   SHA256SUMS.txt                             上传产物的校验和（checksums job 生成）
# 桌面版由 electron-builder 输出到 dist/electron，构建后归集到 dist/linux，
# 与服务端包统一由 Upload release assets 收口。
#
# 产物：
#   - Windows 安装版 / 便携版（PyInstaller 后端 onedir + electron-builder nsis/zip）
#   - Linux deb / rpm（PyInstaller 后端 onedir + electron-builder deb/rpm），
#     x86_64 与 arm64 各有桌面版 + 服务端版两款包（见上方命名表）
#   - Docker 镜像（ghcr.io，tag: vX.Y.Z / X.Y / X / latest；amd64 + arm64 多架构）
#
# 每个平台先产后端 onedir，再让 electron-builder 打成安装包，
# 与本地 build.ps1 + build-electron.ps1 / build-unix.sh 链路一致。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本（如 v1.17.0，须以 v 开头）"
        required: false
        default: ""
      bundle_browser:
        description: "桌面产物捆绑 Chromium 浏览器（false 产出轻量包，渲染按需安装）"
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # 只解析版本号并做 tag 一致性校验，正常 10 秒内结束。
    # 设上限的意义不在它本身，而在于它是所有构建 job 的 needs：
    # 一旦卡住（如 GitHub API 限流重试），整条发版流水线都起不来。
    timeout-minutes: 10
    outputs:
      ver: ${{ steps.resolve.outputs.ver }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            ver="${{ github.event.inputs.tag_name }}"
          else
            ver="${GITHUB_REF_NAME}"
          fi
          ver="${ver#refs/tags/}"
          case "$ver" in
            v*) ;;
            *) echo "::error::版本号必须以 v 开头（如 v1.17.0），收到: $ver"; exit 1 ;;
          esac
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          # rc 版本走预发布：不抢 Latest、不与正式版混在同一个下载入口
          case "$ver" in
            *-rc*|*.rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Resolved version: $ver"

      - uses: actions/checkout@v7

      - name: Ensure release exists (create if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.resolve.outputs.ver }}"
          if ! gh release view "$ver" >/dev/null 2>&1; then
            # 发布说明取自 CHANGELOG.md 中该版本的段落——Release 页要能直接读到
            # 「这个版本改了什么」，而不是一句「自动产物」。CHANGELOG 里的标题形如
            # `## \[1.18.10] - 日期（摘要）`（方括号可能被转义），所以用 index() 匹配。
            # ver 可能带 v 前缀（v1.18.11），而 CHANGELOG 标题是 [1.18.11]，先去掉前缀
            vnum="${ver#v}"
            awk -v v="$vnum" '
              /^## / && index($0, "[" v "]") > 0 {flag=1; next}
              flag && /^## / {exit}
              flag {print}
            ' CHANGELOG.md > /tmp/release-notes.md

            notes_args=(--generate-notes)
            if [ -s /tmp/release-notes.md ]; then
              notes_args=(--notes-file /tmp/release-notes.md)
              echo "Using release notes from CHANGELOG ($(wc -l < /tmp/release-notes.md) lines)"
            else
              echo "::warning::CHANGELOG 中未找到 $vnum 的段落，回退为自动生成说明"
            fi

            # rc 版本发预发布：GitHub 上标记 Pre-release 且不替换 Latest。
            # 注意这里必须就地由 ver 判定，不能引用 needs.prepare 的输出（跨 job 才可用）——
            # 本 step 属于 prepare job 自身，needs 上下文不含自身，表达式恒为空，
            # 会导致 rc 被判成正式版并抢走 Latest（v1.22.3-rc1 首次就踩了这个坑）。
            pre_args=()
            case "$ver" in
              *-rc*|*.rc*)
                pre_args=(--prerelease --latest=false)
                echo "Pre-release (rc) 版本：$ver（不替换 Latest）"
                ;;
            esac
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release create "$ver" --title "$ver" "${notes_args[@]}" "${pre_args[@]}"
            else
              # 手动触发（dispatch）且 Git 内无该 tag 时，从当前 HEAD 建 tag 并发布
              gh release create "$ver" --target "$GITHUB_SHA" --title "$ver" "${notes_args[@]}" "${pre_args[@]}"
            fi
            echo "Created release $ver"
          else
            echo "Release $ver already exists, will upload assets"
            gh release view "$ver" --json isDraft -q .isDraft | grep -q false || gh release edit "$ver" --draft=false
            case "$ver" in
              *-rc*|*.rc*) gh release edit "$ver" --prerelease --latest=false ;;
            esac
          fi

  windows-exe:
    name: Windows portable EXE
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (build venv)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Create venv + install deps
        shell: powershell
        run: |
          uv venv .venv
          # qingci-plugin-sdk 是 pyproject 里的固定版本依赖（官方 PyPI），
          # 随项目一起装，无需单独预装、也不需要额外索引或令牌。
          uv pip install -e ".[build]"

      - name: Set up Node.js (for Web UI build)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI build
        shell: powershell
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend onedir (build.bat)
        shell: cmd
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright
          CI: "1"
        # bundle_browser=false（手动触发）时跳过 Chromium 捆绑，产出轻量包；
        # tag 推送触发时 inputs 为空 → 默认捆绑，保持开箱可渲染
        run: |
          if /i "${{ inputs.bundle_browser }}"=="false" (
            call .\build.bat --no-browser
          ) else (
            call .\build.bat
          )

      - name: Package Windows desktop (build-electron.bat)
        shell: cmd
        # 不在 desktop/electron 下执行：build-electron.bat 自身会 cd 到该目录。
        # 此前「working-directory + 绝对路径 call」组合下脚本未被真正执行，
        # 却以 exit 0 结束，直到上传步骤才因 dist\electron 缺失而失败，
        # 错误定位被推迟了整整一个步骤。
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist build-electron.bat exit /b 1
          call build-electron.bat
          if errorlevel 1 exit /b 1
          if not exist "dist\electron\*.exe" exit /b 1

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ver = "${{ needs.prepare.outputs.ver }}"
          # 命名约定：qingci-bot-ce-<ver>-windows-x64-setup.exe / -windows-x64-portable.zip
          # （由 package.json 的 nsis.artifactName / win.artifactName 决定）
          $setup = Get-ChildItem "dist\electron\*.exe" | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $setup) { throw "setup exe not found (expected qingci-bot-ce-<ver>-windows-x64-setup.exe)" }
          $zip = Get-ChildItem "dist\electron\*.zip" | Where-Object { $_.Name -like "*-portable.zip" } | Select-Object -First 1
          if (-not $zip) { throw "portable zip not found (expected qingci-bot-ce-<ver>-windows-x64-portable.zip)" }
          Write-Host "upload: $($setup.Name) / $($zip.Name)"
          # 校验和由 checksums job 统一生成 SHA256SUMS.txt
          gh release upload "$ver" "$($setup.FullName)" "$($zip.FullName)" --clobber

  linux-deb-rpm:
    name: Linux deb / rpm
    needs: prepare
    # 构建基线固定在「最老的受支持发行版」ubuntu-22.04（glibc 2.35），而不是
    # ubuntu-latest。原因：PyInstaller 会把构建机的 libstdc++/libgcc 打进
    # _internal/，在 24.04 上构建的产物要求 glibc >= 2.38，导致 Ubuntu 22.04
    # (2.35) 与 Debian 12 (2.36) 装得上却启动不了。在老系统上构建，产物在新
    # 系统上照样能跑，反之不成立。
    # 调整该值时，必须同步 scripts/smoke_install_packages.sh 的 UBUNTU_IMAGE
    # 与 ci.yml 的 package-smoke runner，否则冒烟测的系统与产物不匹配。
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # electron-builder 生成 deb / rpm 依赖宿主工具链：
      #   rpm      —— electron-builder 的 rpm 目标通过 fpm 调 rpmbuild 打包
      #   fakeroot —— fpm 非 root 打包 deb 时需要
      #   xz-utils —— rpm payload 压缩
      # 缺任一项会让 --linux deb rpm 在「生成安装包」阶段才失败，故前置安装。
      - name: Install packaging toolchain (rpm / fpm deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot xz-utils file

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create venv + install deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[build]"

      - name: Set up Node.js (for Web UI build)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend onedir (build-unix.sh)
        # bundle_browser=false（手动触发）时跳过 Chromium 捆绑（见 build.bat 步骤说明）
        run: |
          if [ "${{ inputs.bundle_browser }}" = "false" ]; then
            bash build-unix.sh --no-browser
          else
            bash build-unix.sh
          fi

      - name: Pack backend into single archive
        # 后端 onedir 数千个文件 → 单个 zip，安装/解压阶段只处理 1 个文件
        run: python3 scripts/pack_backend.py

      - name: Package deb + rpm (electron-builder --linux)
        working-directory: desktop/electron
        run: |
          npm ci
          npx electron-builder --linux deb rpm --publish never

      - name: Collect desktop packages into dist/linux
        # electron-builder 按 build.directories.output 输出到 dist/electron，
        # 与服务端包统一下沉到 dist/linux，便于下方一次 glob 收齐四个产物
        run: |
          mkdir -p dist/linux
          found=0
          for f in dist/electron/*.deb dist/electron/*.rpm; do
            [ -e "$f" ] || continue
            cp -f "$f" dist/linux/
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::electron-builder produced no deb/rpm under dist/electron"
            ls -R dist/electron 2>/dev/null || true
            exit 1
          fi
          ls -l dist/linux

      # 服务端（headless）包：同一份 PyInstaller 后端 onedir，装到 /opt 并注册 systemd 服务，
      # 不依赖 Electron / X11，适配无桌面环境的服务器。
      - name: Build server deb + rpm (headless + systemd)
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          bash scripts/pack_linux_server.sh --version "${ver#v}"

      - name: Normalize artifact names (linux-x64)
        # 桌面版 deb 走 build.linux.artifactName，rpm 在部分 electron-builder
        # 版本上仍按 fpm 默认命名输出（无平台标识，架构词还是 x86_64）。
        # 统一在此重命名，规则集中在 scripts/normalize_linux_artifacts.sh。
        run: bash scripts/normalize_linux_artifacts.sh dist/linux "${{ needs.prepare.outputs.ver }}" x64

      - name: Verify package metadata & filenames
        # 命名规整化后，文件名必须与包元数据一致，且本 job 恰好 4 个产物（2 deb + 2 rpm，单架构）。
        # 改名/改模板后若产出偏差（如 packageName 漂回默认值、架构给错），这里直接失败，
        # 而不是让用户下到一个名字与内容对不上的包。
        # 断言逻辑与 arm64 job 共用同一脚本（架构作为参数），避免两条链各写一份漂移。
        run: |
          bash scripts/verify_linux_packages.sh \
            dist/linux "${{ needs.prepare.outputs.ver }}" amd64 x86_64

      - name: Install smoke (deb / rpm in containers)
        # 真装一遍再上传：布局/软链/systemd 单元/冻结二进制能否启动并响应
        # /api/bot/health/卸载是否保留数据。只读元数据证明不了「用户装得上」。
        # 脚本与 ci.yml 的 package-smoke 共用，避免两套断言漂移。
        run: bash scripts/smoke_install_packages.sh dist/linux

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          # 桌面包（electron-builder）与服务端包（pack_linux_server.sh）包名不同，
          # 一次 glob 收齐四个产物；校验和由 checksums job 统一生成 SHA256SUMS.txt。
          debs=$(ls dist/linux/*.deb 2>/dev/null || true)
          rpms=$(ls dist/linux/*.rpm 2>/dev/null || true)
          if [ -z "$debs" ] || [ -z "$rpms" ]; then
            echo "::error::linux packages missing under dist/linux (deb/rpm)"
            ls -R dist/linux 2>/dev/null || true
            exit 1
          fi
          gh release upload "$ver" $debs $rpms --clobber

  linux-arm64:
    name: Linux deb / rpm (arm64)
    needs: prepare
    # 原生 arm64 runner 构建，不用 QEMU。
    #
    # 为什么可以直接用原生 runner（v1.22.4 之前用的是「x64 + QEMU 里的
    # ubuntu:22.04(arm64) 容器」，后端构建单步就要 60 分钟以上，比 x64 整条链还慢）：
    #
    #  1) PyInstaller 不能交叉编译，必须在 arm64 上构建——原生 runner 满足这点。
    #  2) 基线必须钉在 ubuntu-22.04（glibc 2.35）。GitHub 同时托管
    #     ubuntu-22.04-arm 与 ubuntu-24.04-arm，用前者即可，不必为了「拿到
    #     arm64」退让到 24.04 的 glibc 2.39（那是 1.22.0 的事故）。
    #     22.04-arm 与 22.04 同代，产物下限与 x64 完全一致。
    #  3) 依赖侧无阻碍：锁文件里的编译扩展（numpy / pyarrow / lancedb /
    #     tiktoken / tokenizers / pydantic-core / uvloop 等 17 个）全部提供
    #     aarch64 manylinux wheel，无需在 arm 上从源码编译。
    #
    # 保留 checkout + npm + electron-builder 的原生路径：electron-builder 在
    # arm64 宿主上打 arm64 包是原生行为，比在 x64 上 --arm64 交叉更少假设。
    # 安装冒烟同样原生执行——smoke_install_packages.sh 的 CONTAINER_PLATFORM
    # 留空即「宿主原生架构」，不再需要 binfmt/QEMU。
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging toolchain
        # 与 x64 job 同款：rpm / fakeroot / xz-utils 是 electron-builder 出
        # deb+rpm 的前置，file 供 verify 脚本判定二进制架构。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot xz-utils file

      # 架构断言：ARM runner 若被误配回 x64（例如标签打错），这里立即失败，
      # 避免在错误架构上产出一个「看起来正常」的 arm64 包名。
      - name: Assert native arm64 host
        run: |
          arch="$(uname -m)"
          echo "== 构建机架构: $arch =="
          [ "$arch" = "aarch64" ] || { echo "::error::期望 aarch64 构建机，实际 $arch"; exit 1; }

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create venv + install deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[build]"

      - name: Set up Node.js (for Web UI build)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend onedir (build-unix.sh)
        # 与 x64 同一种写法：tag 推送时 inputs 为空，字符串比较避免 null 隐式转换失真
        run: |
          if [ "${{ inputs.bundle_browser }}" = "false" ]; then
            bash build-unix.sh --no-browser
          else
            bash build-unix.sh
          fi

      - name: Pack backend into single archive
        run: .venv/bin/python scripts/pack_backend.py

      - name: Package server deb + rpm (arm64)
        # 必须剥掉 tag 的 v 前缀：dpkg 要求 Version 以数字开头，
        # 传 v1.23.0-rc1 会得到 "v1.23.0~rc1" 并被 dpkg-deb 直接拒绝
        # （deb 打包阶段就失败，前面几分钟的构建全部白做）。
        # 与 x64 job 的写法保持一致。
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          bash scripts/pack_linux_server.sh --version "${ver#v}" --out dist/linux

      - name: Package desktop deb + rpm (electron-builder, native arm64)
        working-directory: desktop/electron
        run: |
          npm ci
          npx electron-builder --linux deb rpm --publish never

      - name: Collect packages into dist/linux
        run: |
          found=0
          for f in dist/electron/*.deb dist/electron/*.rpm; do
            [ -e "$f" ] || continue
            cp -f "$f" dist/linux/
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::electron-builder produced no arm64 deb/rpm under dist/electron"
            ls -R dist/electron 2>/dev/null || true
            exit 1
          fi
          ls -l dist/linux

      - name: Normalize artifact names (linux-arm64)
        run: bash scripts/normalize_linux_artifacts.sh dist/linux "${{ needs.prepare.outputs.ver }}" arm64

      - name: Verify package metadata & filenames (arm64 / aarch64)
        run: |
          bash scripts/verify_linux_packages.sh \
            dist/linux "${{ needs.prepare.outputs.ver }}" arm64 aarch64

      - name: Install smoke (deb / rpm, native arm64)
        # CONTAINER_PLATFORM 留空 = 宿主原生架构，不再走 QEMU 模拟
        run: bash scripts/smoke_install_packages.sh dist/linux

      - name: Upload release assets (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          debs=$(ls dist/linux/*.deb 2>/dev/null || true)
          rpms=$(ls dist/linux/*.rpm 2>/dev/null || true)
          if [ -z "$debs" ] || [ -z "$rpms" ]; then
            echo "::error::arm64 packages missing under dist/linux (deb/rpm)"
            ls -R dist/linux 2>/dev/null || true
            exit 1
          fi
          gh release upload "$ver" $debs $rpms --clobber

  macos-dmg:
    name: macOS dmg (arm64)
    needs: prepare
    # 只发布 Apple Silicon（arm64），Intel Mac 不在支持范围内。
    #
    # 为什么用 macos-14 而不是 macos-latest：macos-latest 的架构会随 GitHub
    # 的镜像策略漂移（历史上从 13 的 x64 切到 14 的 arm64），而我们**必须**在
    # arm64 宿主上构建——PyInstaller 不能交叉编译，拿 x64 runner 只会产出
    # x64 后端。显式钉住 macos-14（Apple Silicon / arm64），并在下面用
    # `uname -m` 断言，标签再漂移也能立刻发现。
    #
    # 为什么是 macos-15 而不是 macos-14（实测踩到）：本仓库请求 `macos-14`
    # 会拿到注解
    #     The configuration 'macos-14-arm64-us-default' is not supported
    # 并在 1 秒内被取消（runner_id=0、0 个步骤、日志不存在）——GitHub 已不再
    # 为该标签提供这套 arm64 配置。同批矩阵探测中 macos-15 与 macos-latest
    # 成功、macos-14 取消，因此钉在 macos-15。
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 架构断言：若 runner 标签被改回 x64，这里直接失败，而不是产出一个
      # 「名字写着 arm64、实际跑不了」的包。
      - name: Assert Apple Silicon host
        run: |
          arch="$(uname -m)"
          echo "== 构建机架构: $arch =="
          [ "$arch" = "arm64" ] || { echo "::error::期望 arm64（Apple Silicon），实际 $arch"; exit 1; }

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create venv + install deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[build]"

      - name: Set up Node.js (for Web UI build)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend onedir (build-unix.sh)
        # 与 Linux / Windows 同一种写法：tag 推送时 inputs 为空，字符串比较避免 null 隐式转换失真
        run: |
          if [ "${{ inputs.bundle_browser }}" = "false" ]; then
            bash build-unix.sh --no-browser
          else
            bash build-unix.sh
          fi

      - name: Pack backend into single archive
        run: .venv/bin/python scripts/pack_backend.py

      # electron-builder 按 mac.identity="-" 做 **ad-hoc 签名**（本项目没有
      # Apple Developer 证书）。这一步必须在制作 dmg 之前由 electron-builder
      # 完成——先出 dmg 再补签，dmg 里装的仍是未签名应用。
      # Apple Silicon 对 arm64 原生代码强制要求有效签名，未签名会被系统直接
      # 拒绝，用户看到的是「已损坏，无法打开」。
      - name: Package dmg + zip (electron-builder, ad-hoc signed)
        working-directory: desktop/electron
        run: |
          npm ci
          npx electron-builder --mac dmg zip --publish never

      - name: Verify app bundle (arch / signature / plist / backend runs)
        # 逐条断言架构、ad-hoc 签名有效性、bundle 元信息，并把内嵌 backend.zip
        # 解出来真跑一次 --help——元数据全对但 dylib 缺失或签名失效，前三项
        # 都查不出来。
        run: bash scripts/verify_macos_app.sh dist/electron "${{ needs.prepare.outputs.ver }}"

      - name: Upload release assets (macOS arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          # 命名由 build.mac.artifactName 决定：qingci-bot-ce-<ver>-macos-arm64.{dmg,zip}
          dmg="dist/electron/qingci-bot-ce-${ver#v}-macos-arm64.dmg"
          zip="dist/electron/qingci-bot-ce-${ver#v}-macos-arm64.zip"
          for f in "$dmg" "$zip"; do
            [ -f "$f" ] || { echo "::error::缺少产物: $f"; ls -R dist/electron | head -40; exit 1; }
          done
          # 校验和由 checksums job 统一生成 SHA256SUMS.txt
          gh release upload "$ver" "$dmg" "$zip" --clobber

  docker:
    name: Docker image (ghcr.io)
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-latest
    # 多架构镜像的 arm64 层仍在 x64 runner 上靠 QEMU 构建（见下方 setup-qemu
    # 步骤）。Dockerfile 只装 Python 依赖（纯 wheel），模拟开销可接受，实测
    # 约 4 分钟；给 30 分钟上限既能容纳 registry 抖动，也不会卡住整条流水线。
    # 注：deb/rpm 已改原生 arm64 runner，此处不跟随——buildx 需要单个
    # runner 同时构建两个架构并推送同一 manifest，跨 runner 反而更复杂。
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 image layer)
        # 多架构镜像：arm64 层在 x64 runner 上靠 QEMU 构建（Dockerfile 只装
        # Python 依赖，纯 wheel 安装，模拟开销可接受）。
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          # 多架构 manifest：arm64 主机（树莓派 / ARM 云主机）可直接 docker pull
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  # 校验和收口：等全部构建 job 都成功后，产出 SHA256SUMS.txt
  # （sha256sum 格式，用户可 `sha256sum -c SHA256SUMS.txt`）。
  # 单独成 job 的原因：Windows / Linux / macOS 是并行 job，各自只能算自己那几个
  # 文件，只有 Release 才是全部的合集。
  #
  # 实现上直接用 Release 资产的 `digest` 字段（GitHub 在接收上传时已算好的 sha256），
  # 不把 ~1.8GB 产物下载回来重算——既省 CI 带宽/时间，也避免"算的是一份、用户下的是
  # 另一份"的窗口。若某个资产没有 digest（老资产或平台未提供），直接失败而不是产出
  # 残缺的校验文件。
  checksums:
    name: Release checksums
    needs: [prepare, windows-exe, linux-deb-rpm, linux-arm64, macos-dmg]
    if: >-
      always() &&
      needs.windows-exe.result == 'success' &&
      needs.linux-deb-rpm.result == 'success' &&
      needs.linux-arm64.result == 'success' &&
      needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    # 只读 Release 资产的 digest 字段，不下载产物，正常 1 分钟内结束。
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate SHA256SUMS.txt from asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${{ needs.prepare.outputs.ver }}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ver" \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest // "")  \(.name)"' \
            > /tmp/assets.txt

          echo "== Release 资产 =="
          cat /tmp/assets.txt
          # 期望 4 个 Linux x64 包 + 4 个 Linux arm64 包 + Windows 安装版 + 便携版
          #      + macOS dmg + macOS zip
          # 少了任何一个就说明某个构建 job 静默漏传，比生成残缺校验文件更该拦。
          count=$(wc -l < /tmp/assets.txt)
          [ "$count" -eq 12 ] || { echo "::error::期望 12 个分发包，实际 $count"; exit 1; }

          # 缺 digest 的行形如 "  <name>"（前缀是空串），据此判残缺
          if grep -qE '^  ' /tmp/assets.txt; then
            echo "::error::存在未提供 digest 的资产，拒绝生成残缺校验文件"; exit 1
          fi

          sed 's/^sha256://' /tmp/assets.txt | sort -k2 > SHA256SUMS.txt
          echo "== SHA256SUMS.txt =="
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.prepare.outputs.ver }}"
          # 本 job 不 checkout（无 .git），gh 无法推断仓库，必须显式 --repo；
          # 否则报 fatal: not a git repository
          gh release upload "$ver" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
