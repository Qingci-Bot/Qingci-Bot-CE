name: Desktop Shell CI

# 与 Python 侧 CI 分离：只改 Electron 壳时不再跑 Python 测试与镜像构建。
on:
  push:
    branches: ["main"]
    paths:
      - "desktop/electron/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    # 分支保护要求桌面壳检查全部上报：用 changes job + 条件执行替代 paths 过滤，
    # 未命中路径时 electron job 输出 Skipped（分支保护计为通过），免跑无关构建。

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/electron/**'
              - '.github/workflows/ci-desktop.yml'

  electron:
    name: Electron shell validation
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Electron toolchain
        working-directory: desktop/electron
        run: npm ci

      - name: Syntax check (main / preload)
        working-directory: desktop/electron
        run: |
          node --check src/main.js
          node --check src/preload.js

      - name: Validate package.json build config
        working-directory: desktop/electron
        # 同时锁定 Linux 分发目标为 deb + rpm：本项目不发 AppImage。
        # 若有人误改回 AppImage 或漏掉某一格式，这里立即失败。
        run: |
          node -e "
          const b = require('./package.json').build;
          if (!b || !b.win || !b.extraResources) throw new Error('build config missing');
          const targets = ((b.linux && b.linux.target) || []).map(t => (typeof t === 'string' ? t : t.target));
          for (const want of ['deb', 'rpm']) {
            if (!targets.includes(want)) {
              throw new Error('linux target missing: ' + want + ' (got ' + targets.join(',') + ')');
            }
          }
          if (targets.includes('AppImage')) throw new Error('AppImage target must not be used');
          if (!b.deb || !b.deb.depends || !b.deb.depends.length) throw new Error('deb depends missing');
          if (!b.rpm || !b.rpm.depends || !b.rpm.depends.length) throw new Error('rpm depends missing');
          console.log('build config OK: linux=' + targets.join(','));
          "

      # 注意：Windows 便携版完整打包（Python 后端 onedir + electron-builder portable）
      # 走 build.bat + build-electron.bat（需 Windows + PyInstaller），不在本 job 复现。
