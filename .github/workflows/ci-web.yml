name: Web UI CI

# 与 Python 侧 CI 分离：只改前端时不再触发 docker build、install.sh 冒烟
# 与 3.11 兼容矩阵，避免依赖升级把作业队列排满。
on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    # 分支保护要求前端检查全部上报：用 changes job + 条件执行替代 paths 过滤，
    # 未命中路径时 frontend job 输出 Skipped（分支保护计为通过），免跑无关构建。

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - '.github/workflows/ci-web.yml'

  frontend:
    name: Frontend lint / format / test / build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # vite 8 / ESLint 10 / jsdom 31 要求 Node ^20.19 || >=22.12；
          # 与 ci-desktop / release 统一到 22，避免引擎不匹配与 EBADENGINE
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint (eslint)
        working-directory: web
        run: npm run lint

      - name: Format check (prettier)
        working-directory: web
        run: npm run check

      - name: Test (vitest)
        # 单元测试覆盖请求层/全局 store/composable 等纯逻辑模块
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
