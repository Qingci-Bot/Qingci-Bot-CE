name: CI

# 触发范围刻意收窄，避免一次依赖升级把整个作业队列排满：
# 1) push 只跑 main —— 此前 branches: ["**"] 会让 Dependabot 分支既跑 push
#    又跑 pull_request，同一提交触发两遍完整流水线（12 个 PR → 24 次运行）
# 2) paths 只覆盖 Python 侧 —— Web / 桌面壳改动由 ci-web.yml / ci-desktop.yml
#    负责，不再连带跑 docker build、install.sh 冒烟与 3.11 矩阵
# 3) PR 全量上报必需检查，但 docker / compat / audit / install-script 按
#    changes job 的路径判定条件执行（Skipped 计为通过），文档/前端-only 的
#    PR 不再触发无关全量构建
on:
  push:
    branches: ["main"]
    paths:
      - "bot/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "migrations/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "config.example.yaml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "install.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    # 不使用 paths 过滤：分支保护要求 7 项必需检查全部上报。
    # 改用 changes job + 条件执行：未命中路径的 job 输出 Skipped 状态——
    # 分支保护将 Skipped 计为通过，既上报了必需检查又免跑无关全量构建。

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      compat: ${{ steps.filter.outputs.compat }}
      audit: ${{ steps.filter.outputs.audit }}
      docker: ${{ steps.filter.outputs.docker }}
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            compat:
              - 'bot/**'
              - 'api/**'
              - 'tests/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'migrations/**'
              - 'alembic.ini'
              - 'config.example.yaml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            audit:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'bot/**'
              - 'api/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'config.example.yaml'
              - '.github/workflows/ci.yml'
            install:
              - 'install.sh'
              - 'main.py'
              - 'bot/**'
              - 'api/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'config.example.yaml'
              - '.github/workflows/ci.yml'

  quality:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 与本地开发对齐；uv 版本变化会改变锁文件格式与解析行为
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 严格按 uv.lock 安装：锁文件与 pyproject 不一致时直接失败。
        # 此前用 pip 安装，uv.lock 形同虚设——CI 实际解析结果可能与开发者
        # 锁定的版本完全不同，且会随上游发版静默漂移。
        run: uv sync --locked --python 3.12 --extra dev

      - name: Verify SDK version within ABI range
        # SDK 兼容性由 ABI 能力探测保证（bot/plugin/abi.py），pyproject 声明的是
        # 版本区间而非精确钉版。这里核对「实际安装/锁定的版本落在 pyproject 区间内」，
        # 防止锁文件与 pyproject 漂移或区间外版本混入；uv sync --locked 已保证二者
        # 一致，此步骤为独立双检。
        run: |
          uv run --no-sync python - <<'EOF'
          import pathlib, re, tomllib

          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          import qingci_plugin_sdk

          spec = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          dep = next(d for d in spec if d.startswith("qingci-plugin-sdk"))
          m = re.fullmatch(r"qingci-plugin-sdk(>=.+)", dep)
          assert m, f"SDK 应声明区间约束（qingci-plugin-sdk>=X,<Y）：{dep!r}"
          req = m.group(1)
          installed = qingci_plugin_sdk.__version__
          assert Version(installed) in SpecifierSet(req), (
              f"SDK 版本越界：pyproject 允许 {req}，实际安装 {installed}"
          )
          lock = tomllib.loads(pathlib.Path("uv.lock").read_text(encoding="utf-8"))
          pkg = next(p for p in lock["package"] if p["name"] == "qingci-plugin-sdk")
          assert pkg["version"] == installed, (
              f"uv.lock 锁定 {pkg['version']} 与实际安装 {installed} 不一致"
          )
          print(f"SDK {installed} 在兼容区间 {req} 内 OK（官方 PyPI，ABI 探测见 bot/plugin/abi.py）")
          EOF

      - name: Verify lock sources are canonical
        # uv.lock 若在配置了镜像（pip.conf / uv.toml）的机器上生成，会把镜像地址
        # 写进锁文件；CI 用官方源解析时就会判定「锁文件需要更新」而失败。
        # SDK 自 1.15.2 起也来自官方 PyPI，因此所有包一律只允许 pypi.org/simple。
        run: |
          bad=$(grep -oE 'registry = "https://[^"]+"' uv.lock | sort -u | grep -vE 'https://pypi\.org/simple' || true)
          if [ -n "$bad" ]; then
            echo "uv.lock 含非官方索引，请用 --default-index https://pypi.org/simple 重新生成："
            echo "$bad"
            exit 1
          fi
          uv run --no-sync python - <<'EOF'
          import pathlib, tomllib

          lock = tomllib.loads(pathlib.Path("uv.lock").read_text(encoding="utf-8"))
          pkg = next(p for p in lock["package"] if p["name"] == "qingci-plugin-sdk")
          src = pkg.get("source", {}).get("registry")
          assert src == "https://pypi.org/simple", f"SDK 未从官方 PyPI 解析：{src!r}"
          print(f"uv.lock 来源检查通过（含 SDK 在内均为官方 PyPI，SDK {pkg['version']}）")
          EOF

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy api bot desktop plugins

      - name: Test with coverage
        # --cov-fail-under 已在 pyproject addopts 中配置，低于门槛即失败
        run: uv run --no-sync pytest -q

      - name: Verify DB migrations (empty db)
        # 空库 upgrade head + alembic check，防止模型改动后迁移脚本失效
        run: uv run --no-sync python scripts/verify_migrations.py

      - name: Directory coverage gate (bot/llm >= 74%)
        # LLM 子系统为核心能力，目录级门槛防其覆盖率回退（当前 76%）
        # P0 行为锁定后随全局门槛一起抬升，只升不降
        run: uv run --no-sync coverage report --include='bot/llm/*' --fail-under=74

  compat:
    # 静态名（不能用 matrix 插值）：job 级 if 跳过时矩阵未展开，插值名会以
    # 字面量上报，与分支保护必需检查名「Python 3.11 compatibility」失配，
    # 导致合并被永久阻塞
    name: Python 3.11 compatibility
    needs: changes
    # 兼容性只与 Python 运行代码/依赖相关，纯文档/前端 PR 跳过
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python 声明 >=3.11，但此前只在 3.12 上验证：
        # 一旦引入 3.11/3.12 专属语法或 API，CI 全绿而低版本用户直接崩。
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 兼容性验证只需运行期依赖 + 测试依赖，不拉 playwright/lancedb/pyinstaller
        run: uv sync --locked --python ${{ matrix.python }} --extra test

      - name: Test
        # 只验证「能在声明的最低版本上跑通」，不重复跑覆盖率门槛（见 quality job）
        run: uv run --no-sync pytest -q -o addopts=""

  audit:
    name: Dependency audit (pip-audit)
    needs: changes
    # 依赖审计只依赖锁文件/清单变化（本 job 本身 continue-on-error，非阻断）
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    # 初始为「只报告不阻断」：存量依赖可能带有已知 CVE，需人工 triage 后再
    # 提升为阻断（去掉 continue-on-error）。否则一上线就是红的，无人处理。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Audit
        # pip-audit 不进锁文件（仅 CI 工具），临时装入 venv。
        # 审计全部第三方依赖：qingci-plugin-sdk 自 1.15.2 起发布在官方 PyPI，
        # 漏洞库可查，不再需要从导出清单中剔除。
        run: |
          uv pip install --python .venv pip-audit
          uv export --no-emit-project --format requirements-txt --no-hashes > /tmp/audit-reqs.txt
          uv run --no-sync pip-audit -r /tmp/audit-reqs.txt

  docker:
    name: Docker build & smoke run
    needs: changes
    # 镜像构建只与运行代码/镜像定义相关，纯文档/前端 PR 跳过
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t qingci-bot-ce:ci .

      - name: Smoke run (container)
        run: |
          docker run -d --name qc-smoke -p 18080:8080 qingci-bot-ce:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/bot/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              docker logs qc-smoke | tail -n 20
              docker rm -f qc-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API 未在 30s 内就绪"
          docker logs qc-smoke
          docker rm -f qc-smoke >/dev/null
          exit 1

  install-script:
    name: install.sh smoke test
    needs: changes
    # 安装冒烟只与安装脚本/运行入口/依赖清单相关
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shell syntax check
        run: bash -n install.sh

      - name: Run install.sh (skip system deps)
        run: SKIP_SYS_DEPS=1 ./install.sh --dev

      - name: Boot smoke test
        run: |
          .venv/bin/python main.py &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/bot/health >/dev/null 2>&1; then
              echo "Boot OK after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::main.py 未在 60s 内就绪"
            exit 1
          fi