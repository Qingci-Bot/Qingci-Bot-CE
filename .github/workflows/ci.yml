name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 与本地开发对齐；uv 版本变化会改变锁文件格式与解析行为
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 严格按 uv.lock 安装：锁文件与 pyproject 不一致时直接失败。
        # 此前用 pip 安装，uv.lock 形同虚设——CI 实际解析结果可能与开发者
        # 锁定的版本完全不同，且会随上游发版静默漂移。
        run: uv sync --locked --python 3.12 --extra dev

      - name: Verify SDK version matches lock
        # SDK 以 git+@tag 形式锁定；构建可复现要求实际安装的 SDK 版本
        # 与 pyproject.toml 锁定的 tag 完全一致，防止锁错/上游漂移
        run: |
          uv run --no-sync python - <<'EOF'
          import re, tomllib
          import qingci_plugin_sdk

          spec = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          dep = next(d for d in spec if d.startswith("qingci-plugin-sdk"))
          m = re.search(r"@v([\d.]+)", dep)
          assert m, f"SDK 依赖未锁定到 tag: {dep!r}"
          locked = m.group(1)
          installed = qingci_plugin_sdk.__version__
          assert locked == installed, (
              f"SDK 版本不一致: pyproject 锁定 {locked}，实际安装 {installed}"
          )
          print(f"SDK {installed} == 锁定 {locked} OK")
          EOF

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy api bot desktop

      - name: Test with coverage
        # --cov-fail-under 已在 pyproject addopts 中配置，低于门槛即失败
        run: uv run --no-sync pytest -q

      - name: Verify DB migrations (empty db)
        # 空库 upgrade head + alembic check，防止模型改动后迁移脚本失效
        run: uv run --no-sync python scripts/verify_migrations.py

      - name: Directory coverage gate (bot/llm >= 70%)
        # LLM 子系统为核心能力，目录级门槛防其覆盖率回退（当前 76%）
        run: uv run --no-sync coverage report --include='bot/llm/*' --fail-under=70

  compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python 声明 >=3.10，但此前只在 3.12 上验证：
        # 一旦引入 3.11/3.12 专属语法或 API，CI 全绿而低版本用户直接崩。
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 兼容性验证只需运行期依赖 + 测试依赖，不拉 playwright/lancedb/pyinstaller
        run: uv sync --locked --python ${{ matrix.python }} --extra test

      - name: Test
        # 只验证「能在声明的最低版本上跑通」，不重复跑覆盖率门槛（见 quality job）
        run: uv run --no-sync pytest -q -o addopts=""

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # 初始为「只报告不阻断」：存量依赖可能带有已知 CVE，需人工 triage 后再
    # 提升为阻断（去掉 continue-on-error）。否则一上线就是红的，无人处理。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Audit
        # pip-audit 不进锁文件（仅 CI 工具），临时装入 venv
        run: |
          uv pip install --python .venv pip-audit
          uv run --no-sync pip-audit --skip-editable

  electron:
    name: Electron shell validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Electron toolchain
        working-directory: desktop/electron
        run: npm ci

      - name: Syntax check (main / preload)
        working-directory: desktop/electron
        run: |
          node --check src/main.js
          node --check src/preload.js

      - name: Validate package.json build config
        working-directory: desktop/electron
        run: node -e "const b=require('./package.json').build; if(!b||!b.win||!b.extraResources) throw new Error('build config missing'); console.log('build config OK')"

      # 注意：Windows 便携版完整打包（Python 后端 onedir + electron-builder portable）
      # 走 build.bat + build-electron.bat（需 Windows + PyInstaller），不在本 job 复现。

  frontend:
    name: Frontend lint / format / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint (eslint)
        working-directory: web
        run: npm run lint

      - name: Format check (prettier)
        working-directory: web
        run: npm run check

      - name: Test (vitest)
        # 单元测试覆盖请求层/全局 store/composable 等纯逻辑模块
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker build & smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t qingci-bot-ce:ci .

      - name: Smoke run (container)
        run: |
          docker run -d --name qc-smoke -p 18080:8080 qingci-bot-ce:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/bot/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              docker logs qc-smoke | tail -n 20
              docker rm -f qc-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API 未在 30s 内就绪"
          docker logs qc-smoke
          docker rm -f qc-smoke >/dev/null
          exit 1

  install-script:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax check
        run: bash -n install.sh

      - name: Run install.sh (skip system deps)
        run: SKIP_SYS_DEPS=1 ./install.sh --dev

      - name: Boot smoke test
        run: |
          .venv/bin/python main.py &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/bot/health >/dev/null 2>&1; then
              echo "Boot OK after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::main.py 未在 60s 内就绪"
            exit 1
          fi