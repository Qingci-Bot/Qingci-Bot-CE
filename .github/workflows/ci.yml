name: CI

# 触发范围刻意收窄，避免一次依赖升级把整个作业队列排满：
# 1) push 只跑 main —— 此前 branches: ["**"] 会让 Dependabot 分支既跑 push
#    又跑 pull_request，同一提交触发两遍完整流水线（12 个 PR → 24 次运行）
# 2) paths 只覆盖 Python 侧 —— Web / 桌面壳改动由 ci-web.yml / ci-desktop.yml
#    负责，不再连带跑 docker build、install.sh 冒烟与 3.10/3.11 矩阵
on:
  push:
    branches: ["main"]
    paths:
      - "bot/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "migrations/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "config.example.yaml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "install.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    # 不使用 YAML 锚点复用上面的列表：GitHub Actions 对 anchors/aliases 支持不可靠
    paths:
      - "bot/**"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "migrations/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "config.example.yaml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "install.sh"
      - ".github/workflows/ci.yml"

jobs:
  quality:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 与本地开发对齐；uv 版本变化会改变锁文件格式与解析行为
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 严格按 uv.lock 安装：锁文件与 pyproject 不一致时直接失败。
        # 此前用 pip 安装，uv.lock 形同虚设——CI 实际解析结果可能与开发者
        # 锁定的版本完全不同，且会随上游发版静默漂移。
        run: uv sync --locked --python 3.12 --extra dev

      - name: Verify SDK version matches lock
        # SDK 由私有索引分发并精确锁定；构建可复现要求实际安装的版本
        # 与 pyproject.toml 声明完全一致，防止锁错/上游漂移
        run: |
          uv run --no-sync python - <<'EOF'
          import re, tomllib
          import qingci_plugin_sdk

          spec = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          dep = next(d for d in spec if d.startswith("qingci-plugin-sdk"))
          m = re.search(r"==\s*([\d.]+)", dep)
          assert m, f"SDK 依赖未精确锁定版本: {dep!r}"
          locked = m.group(1)
          installed = qingci_plugin_sdk.__version__
          assert locked == installed, (
              f"SDK 版本不一致: pyproject 锁定 {locked}，实际安装 {installed}"
          )
          print(f"SDK {installed} == 锁定 {locked} OK")
          EOF

      - name: Verify lock sources are canonical
        # uv.lock 若在配置了镜像（pip.conf / uv.toml）的机器上生成，会把镜像地址
        # 写进锁文件；CI 用官方源解析时就会判定「锁文件需要更新」而失败。
        # 只允许官方 PyPI 与私有索引两种来源。
        run: |
          bad=$(grep -oE 'registry = "https://[^"]+"' uv.lock | sort -u                 | grep -vE 'https://pypi\.org/simple|https://pypi\.luoqingciya\.cn/simple' || true)
          if [ -n "$bad" ]; then
            echo "uv.lock 含非官方索引，请用 --default-index https://pypi.org/simple 重新生成："
            echo "$bad"
            exit 1
          fi
          echo "uv.lock 索引来源检查通过"

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy api bot desktop plugins

      - name: Test with coverage
        # --cov-fail-under 已在 pyproject addopts 中配置，低于门槛即失败
        run: uv run --no-sync pytest -q

      - name: Verify DB migrations (empty db)
        # 空库 upgrade head + alembic check，防止模型改动后迁移脚本失效
        run: uv run --no-sync python scripts/verify_migrations.py

      - name: Directory coverage gate (bot/llm >= 70%)
        # LLM 子系统为核心能力，目录级门槛防其覆盖率回退（当前 76%）
        run: uv run --no-sync coverage report --include='bot/llm/*' --fail-under=70

  compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python 声明 >=3.10，但此前只在 3.12 上验证：
        # 一旦引入 3.11/3.12 专属语法或 API，CI 全绿而低版本用户直接崩。
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        # 兼容性验证只需运行期依赖 + 测试依赖，不拉 playwright/lancedb/pyinstaller
        run: uv sync --locked --python ${{ matrix.python }} --extra test

      - name: Test
        # 只验证「能在声明的最低版本上跑通」，不重复跑覆盖率门槛（见 quality job）
        run: uv run --no-sync pytest -q -o addopts=""

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # 初始为「只报告不阻断」：存量依赖可能带有已知 CVE，需人工 triage 后再
    # 提升为阻断（去掉 continue-on-error）。否则一上线就是红的，无人处理。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Audit
        # pip-audit 不进锁文件（仅 CI 工具），临时装入 venv
        run: |
          uv pip install --python .venv pip-audit
          uv run --no-sync pip-audit --skip-editable

  docker:
    name: Docker build & smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t qingci-bot-ce:ci .

      - name: Smoke run (container)
        run: |
          docker run -d --name qc-smoke -p 18080:8080 qingci-bot-ce:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/bot/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              docker logs qc-smoke | tail -n 20
              docker rm -f qc-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API 未在 30s 内就绪"
          docker logs qc-smoke
          docker rm -f qc-smoke >/dev/null
          exit 1

  install-script:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shell syntax check
        run: bash -n install.sh

      - name: Run install.sh (skip system deps)
        run: SKIP_SYS_DEPS=1 ./install.sh --dev

      - name: Boot smoke test
        run: |
          .venv/bin/python main.py &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/bot/health >/dev/null 2>&1; then
              echo "Boot OK after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::main.py 未在 60s 内就绪"
            exit 1
          fi