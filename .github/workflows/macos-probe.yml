name: macOS runner probe

# 临时诊断用：确认本仓库能否调度 GitHub 托管的 macOS runner，以及哪个标签可用。
# 只做最少的探测（架构 + 工具可用性），不构建任何产物。
#
# 背景：1.23.0-rc1 发版时 macos-dmg job 启动 1 秒即被取消、runner_id=0、0 个步骤。
# 单独探测拿到注解：
#   The configuration 'macos-14-arm64-us-default' is not supported
# 说明不是工作流写法问题，而是该仓库拿不到这个 runner 配置。
# 这里用矩阵把候选标签都试一遍，找出（如果存在）可用配置。
# 诊断完成后删除本文件。
on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    # fail-fast=false：某个标签不可用不影响其他标签继续尝试
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-latest
          - macos-15
          - macos-14
          - macos-13
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    steps:
      - name: Report host facts
        run: |
          echo "label: ${{ matrix.label }}"
          echo "uname -m: $(uname -m)"
          sw_vers
          echo "codesign: $(command -v codesign || echo missing)"
          echo "lipo: $(command -v lipo || echo missing)"
          echo "plutil: $(command -v plutil || echo missing)"
          echo "node: $(node --version 2>/dev/null || echo none)"
          echo "python3: $(python3 --version 2>/dev/null || echo none)"
