<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP 说明：script-src 保留 'unsafe-inline' 是 Vite 内联 module preload polyfill 所需，
    未来可通过 build.modulePreload.polyfill=false 移除。
    样式侧同样需要 'unsafe-inline'：下面有内联的首屏关键样式。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0f1a">
  <title>Qingci-Bot CE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <!--
    首屏关键样式（critical CSS，内联）

    为什么必须有：样式表的 <link> 由 Vite 注入在 head 末尾，在它到达之前文档是
    浏览器默认的**白色**。本项目是暗色主题，窗口一打开会先闪一下白、再变暗——
    看起来就是"加载慢"（桌面壳从启动页切到 /ui 时尤其明显）。

    内联最小限度的底色与骨架，保证第一帧就是品牌暗色。Vue 挂载时
    `mount('#app')` 会整体替换 #app 的内容，骨架自动消失，不需要清理代码。
    `color-scheme: dark` 让滚动条与表单控件一开始就是暗色，避免二次跳变。
  -->
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #boot-splash .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 700;
      color: #0b0f1a;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.25);
      animation: boot-breathe 1.6s ease-in-out infinite;
    }
    #boot-splash .name {
      font-size: 13px;
      letter-spacing: 0.4px;
      color: #94a3b8;
    }
    #boot-splash .bar {
      width: 120px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(148, 163, 184, 0.18);
    }
    #boot-splash .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      animation: boot-slide 1.2s ease-in-out infinite;
    }
    @keyframes boot-breathe {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes boot-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    /* 尊重系统「减少动态效果」设置 */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .logo, #boot-splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 首屏骨架：Vue 挂载后整体被替换掉 -->
    <div id="boot-splash">
      <div class="logo">Q</div>
      <div class="name">Qingci-Bot CE</div>
      <div class="bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
