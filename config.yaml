bot:
  name: Qingci-Bot
  admin_users:
  - 2101171459
  trigger_mode: at
  trigger_keywords:
  - /bot
  - /ai
  group_blacklist: []
  user_blacklist: []
  log_json: false
onebot:
  host: 127.0.0.1
  port: 8888
  access_token: ''
llm:
  provider: deepseek
  api_url: https://api.deepseek.com/v1
  api_key: ''
  model: deepseek-chat
  max_tokens: 2048
  temperature: 0.7
  system_prompt: 你是一个友好的 QQ 机器人助手。请用简洁、自然的中文回复。
  max_history: 20
  max_context_tokens: 8192
  timeout: 60
  num_retries: 2
  enable_summary: false
  enable_tools: false
  max_tool_rounds: 5
rate_limit:
  enabled: false
  daily_limit: 50
  cooldown_seconds: 10
filter:
  enabled: false
  words_file: data/sensitive_words.txt
  exempt_admins: true
scheduler:
  enabled: true
alert:
  enabled: false
  error_threshold: 5
  cooldown_minutes: 10
image:
  enabled: false
  model: dall-e-3
  api_url: ''
  api_key: ''
rag:
  enabled: false
  embedding_model: ''
  top_k: 3
  knowledge_dir: data/knowledge
  chunk_size: 400
  chunk_overlap: 50
  max_inject_chars: 800
session_summary:
  enabled: false
  keep_recent_turns: 3
  max_messages: 20
  max_tokens: 4096
  summary_max_tokens: 512
log:
  usage_tracking: true
api_key: ''
