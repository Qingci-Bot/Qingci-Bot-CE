<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>Qingci-Bot CE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f1a;
      color: #e5e7eb;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .logo {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #60a5fa, #38bdf8 55%, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline { margin-top: 10px; font-size: 13px; color: #64748b; }
    .spinner {
      margin-top: 34px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">Qingci-Bot CE</div>
  <div class="tagline">正在启动后端服务…</div>
  <div class="spinner"></div>
</body>
</html>
