repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 pyproject.toml 的 ruff==0.16.3 保持一致，避免本地钩子与 CI 规则漂移
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']