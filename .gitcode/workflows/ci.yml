name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint / Type / Test
    runs-on: [ubuntu-24, x64, small]
    steps:
      - uses: checkout

      - name: 设置 Python
        uses: setup-python
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy api bot desktop

      - name: Test with coverage
        # --cov-fail-under 已在 pyproject addopts 中配置，低于门槛即失败
        run: pytest -q

  docker-build:
    name: Docker build 验证 (Kaniko)
    # GitCode runner 无 Docker daemon（预装 Kaniko 无 daemon 构建 + Docker CLI 备用路径），
    # 故以 Kaniko --no-push 构建导出 tar 验证 Dockerfile 可完整构建（含 git 依赖拉取）。
    runs-on: [ubuntu-24, x64, medium]
    steps:
      - uses: checkout

      - name: 校验 docker-compose YAML
        run: python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml')); print('docker-compose YAML 校验通过')"

      - name: Kaniko 构建镜像并导出（no-push）
        run: |
          kaniko --context . \
            --dockerfile Dockerfile \
            --no-push \
            --tar-path=/tmp/qingci-bot-ce.tar \
            --destination qingci-bot-ce:ci

      - name: 校验构建产物
        run: |
          ls -lh /tmp/qingci-bot-ce.tar

  install-script:
    name: install.sh smoke test
    runs-on: [ubuntu-24, x64, small]
    steps:
      - uses: checkout

      - name: Shell 语法检查
        run: bash -n install.sh

      - name: 执行 install.sh (跳过系统依赖)
        # runner 已具备 git/python，跳过 apt 系统依赖安装，只验证脚本的
        # Python 版本检测 / venv 创建 / 依赖安装（pip 分支）
        run: SKIP_SYS_DEPS=1 ./install.sh --dev

      - name: 启动冒烟测试
        run: |
          .venv/bin/python main.py --instance default &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/bot/health >/dev/null 2>&1; then
              echo "Boot OK after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::main.py 未在 60s 内就绪"
            exit 1
          fi