# Qingci-Bot CE 配置模板
# 复制为 config.yaml 后按需修改；敏感字段（api_key / access_token）默认留空。
# 注意：config.yaml 已被 .gitignore 忽略，不会随代码提交，避免密钥泄露。

bot:
  name: Qingci-Bot CE
  super_admin: null             # 超级管理员 ID（唯一；平台无关字符串标识，如 QQ 号/Telegram 用户 ID）
  admin_users: []               # 普通管理员 ID 列表，如 ['123456789', '987654321']
  trigger_mode: at            # at / keyword / always
  trigger_keywords:
  - /bot
  - /ai
  group_blacklist: []          # 群黑名单（平台无关字符串标识）
  user_blacklist: []           # 用户黑名单
  log_json: false
  wizard_skipped: false        # 是否跳过了首次配置引导
onebot:
  enabled: true                # 是否启动 OneBot 反向 WS 服务端（Telegram 主平台实例可设为 false）
  host: 127.0.0.1
  port: 3001
  access_token: ''            # OneBot 接入令牌，留空则不校验
platforms:
  telegram:                    # Telegram 平台适配器（默认关闭）
    enabled: false             # true 启用后接入 Telegram（Bot API 长轮询）
    token: ''                  # Bot API token（@BotFather 获取）
    poll_interval: 1.0         # 长轮询间隔（秒）
    request_timeout: 40.0      # HTTP 请求超时（秒），须大于长轮询 timeout（30）
    max_retries: 0             # 网络传输错误最多重试次数（0 不重试，避免发送类重复）
  onebot12:                    # OneBot 12 原生反向 WS 适配器（默认关闭）
    enabled: false             # true 启用后协议端（NapCat/Lagrange 等）连 ws://host:port/
    host: 127.0.0.1            # 监听地址
    port: 3002                 # 监听端口（与 onebot.port 区分）
    access_token: ''           # 可选；实现端以 Authorization: Bearer 或 ?access_token= 携带
market:
  url: https://gitee.com/qingci-bot/Plugin-Market.git  # 插件市场索引仓库（默认指 Gitee 国内镜像，拉取更快；可改 https://github.com/Qingci-Bot/Plugin-Market.git 切换 GitHub 主仓库）
  refresh_interval: 3600       # 索引缓存 TTL（秒）
llm:
  provider: deepseek          # openai / deepseek / ollama / siliconflow / claude / gemini / custom
  api_url: https://api.deepseek.com/v1
  api_key: ''                 # 必填（ollama 除外）
  model: deepseek-chat
  max_tokens: 2048
  temperature: 0.7
  system_prompt: 你是一个友好、乐于助人的机器人助手。请用简洁、自然的中文回复。
  personas: []                # 人格列表：[{name, description, system_prompt}]
  default_persona: ''         # 默认人格名，留空使用 system_prompt
  max_history: 20
  max_context_tokens: 8192
  timeout: 60
  num_retries: 2
  enable_summary: false
  enable_tools: false
  max_tool_rounds: 5
  mcp_servers: []             # MCP 服务器：[{name, command, args, url, env}]
rate_limit:
  enabled: false
  daily_limit: 50
  cooldown_seconds: 10
filter:
  enabled: false
  words_file: data/sensitive_words.txt
  exempt_admins: true
scheduler:
  enabled: true
hot_reload:
  enabled: false
  interval: 2.0
alert:
  enabled: false
  error_threshold: 5
  cooldown_minutes: 10
image:
  enabled: false
  model: dall-e-3
  api_url: ''
  api_key: ''
rag:
  enabled: false
  mode: keyword               # keyword / vector
  embedding_model: ''          # 向量模型（vector 模式使用）
  embedding_api_url: ''        # 向量 API 地址（留空复用 llm.api_url）
  embedding_api_key: ''        # 向量 API Key（留空复用 llm.api_key）
  top_k: 3
  knowledge_dir: data/knowledge
  chunk_size: 400
  chunk_overlap: 50
  max_inject_chars: 800
  collection_name: qingci_knowledge
session_summary:
  enabled: false
  keep_recent_turns: 3
  max_messages: 20
  max_tokens: 4096
  summary_max_tokens: 512
log:
  usage_tracking: true         # LLM 用量入库（Dashboard 用量统计依赖）
  level: INFO                  # 日志级别：DEBUG / INFO / WARNING / ERROR
  log_file_enabled: false      # 是否启用文件日志（轮转）
  log_file_max_bytes: 10485760 # 单文件最大字节数（默认 10 MB）
  log_file_backup_count: 5     # 保留备份数
  log_dir: logs                # 日志目录（相对路径基于 app_root）
api_key: ''                   # WebUI/API 鉴权密钥，留空则免鉴权
